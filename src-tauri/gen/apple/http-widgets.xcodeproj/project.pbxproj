			shellScript = "set -e\n# Xcode.app is launched by LaunchServices, so this script starts with\n# a bare PATH: no rustup, no node, no Tauri CLI. Homebrew's rustc has\n# no iOS targets, so ~/.cargo/bin must come first or the build fails\n# with \"can't find crate for `core`\".\nexport PATH=\"$HOME/.cargo/bin:$SRCROOT/../../../node_modules/.bin:$PATH\"\n\n# The Tauri CLI is a #!/usr/bin/env node script, and nvm keeps node\n# where Xcode never looks. nvm's default alias is often \"lts/*\"\n# rather than a version, so take the newest install instead.\nif ! command -v node >/dev/null 2>&1; then\n  for dir in \\\n    \"$(ls -1d \"${NVM_DIR:-$HOME/.nvm}\"/versions/node/*/bin 2>/dev/null | sort -V | tail -1)\" \\\n    /opt/homebrew/bin \\\n    /usr/local/bin; do\n    if [ -n \"$dir\" ] && [ -x \"$dir/node\" ]; then\n      export PATH=\"$dir:$PATH\"\n      break\n    fi\n  done\nfi\n\ncommand -v node >/dev/null 2>&1 || { echo \"error: node not found — the Tauri CLI needs it; install node or add it to PATH\"; exit 1; }\ncommand -v tauri >/dev/null 2>&1 || { echo \"error: tauri CLI not found — run 'npm install' in the repo root\"; exit 1; }\ncommand -v cargo >/dev/null 2>&1 || { echo \"error: cargo not found — install rustup plus the iOS targets\"; exit 1; }\ntauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths \"${FRAMEWORK_SEARCH_PATHS:?}\" --header-search-paths \"${HEADER_SEARCH_PATHS:?}\" --gcc-preprocessor-definitions \"${GCC_PREPROCESSOR_DEFINITIONS:-}\" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}\n";
