name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      # A packaging mistake (a new folder missing from build.files) only shows
      # up in a real build, so do one without publishing anything.
      - name: Build the app
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
