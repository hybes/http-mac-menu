name: Release

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a new build.
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major]

# Two releases at once would race on the version bump and the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The version bump pushes back to main; without this it would trigger
    # itself forever.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bump the version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump || 'patch' }}" -m "release v%s [skip ci]"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Universal builds are not used here: the README offers a download per
      # architecture, and two smaller downloads beat one twice the size.
      - name: Build and publish
        run: npm run build:css && npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID certificate on CI: build unsigned rather than
          # failing while looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Push the version commit and tag
        run: git push --follow-tags origin HEAD:main

      - name: Summary
        run: |
          echo "Released **v${{ steps.bump.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
