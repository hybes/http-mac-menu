<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>SOL Wallet Tracker</title>
		<link rel="stylesheet" href="../output.css" />
		<style>
			@font-face {
				font-family: "Hubot Sans";
				src: url("../assets/Hubot-Sans.woff2")
						format("woff2 supports variations"),
					url("../assets/Hubot-Sans.woff2") format("woff2-variations");
				font-weight: 200 900;
				font-stretch: 75% 125%;
			}
			:root {
				font-family: "Hubot Sans";
				font-size: 16px;
				line-height: 24px;

				color-scheme: dark;
				color: rgba(255, 255, 255, 0.87);
				background-color: #101010;

				scroll-behavior: smooth;

				font-synthesis: none;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				-webkit-text-size-adjust: 100%;

				overflow-y: scroll; /* has to be scroll, not auto */
				-webkit-overflow-scrolling: touch;
			}
		</style>
	</head>
	<body>
		<h1 class="font-semibold text-xl text-center mt-4">Settings</h1>
		<div class="w-full h-full">
			<form id="form" name="config" class="my-4 flex flex-col justify-center items-center">
				<div class="flex flex-col gap-2 p-2 w-[700px] justify-center items-center border-b border-b-white/30">
					<div class="flex gap-4 items-center">
						<label class="w-[250px]" for="url">API Key</label>
						<input type="text" class="px-4 py-2 w-[400px] rounded-full placeholder:text-stone-500" id="apiKey" placeholder="09019he0219h029he2s2d22fgh543" />
					</div>
					<a href="#" id="externalLink">
						<p class="text-sm text-stone-500">How to get API Key?</p>
					</a>
				</div>
				<div class="flex flex-col gap-2 p-2 w-[700px] justify-center items-center border-b border-b-white/30">
					<div class="flex gap-4 items-center">
						<label class="w-[250px]" for="url">Wallet Address</label>
						<input type="text" class="px-4 py-2 w-[400px] rounded-full placeholder:text-stone-500" id="address" placeholder="7bpworj3zrfzxrvBXsDomAJ6TrYPMoHgGyYBkCdpV46Z" />
					</div>
				</div>
				<div class="flex flex-col gap-4 p-2 w-[700px] justify-center items-center">
					<div class="flex gap-4 items-center">
						<label class="w-[250px]" for="url">Percentage Change</label>
						<input type="text" class="px-4 py-2 w-[400px] rounded-full placeholder:text-stone-500" id="percent" placeholder="20" />
					</div>
				</div>
				<input class="bg-blue-500 hover:bg-blue-600 w-[150px] py-2 rounded-full cursor-pointer" type="submit" id="saveConfig" value="Save" />
			</form>
		</div>
	</body>
	<script src="../scripts/config.renderer.js"></script>
</html>
