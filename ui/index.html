<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>HTTP Widgets</title>
    <link rel="stylesheet" href="output.css" />
    <script src="api.js"></script>
  </head>
  <body class="app-shell app-frame">
    <header class="app-bar app-frame-bar">
      <div
        class="app-bar-drag-region desktop-only"
        data-tauri-drag-region
        aria-hidden="true"
      ></div>
      <div class="app-bar-inner" id="appBar">
        <div class="app-bar-title"><h1>HTTP Widgets</h1></div>
      </div>
    </header>

    <main class="app-content app-view" id="view" aria-busy="true">
      <p class="status boot-status" role="status">Loading…</p>
    </main>

    <p
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>

    <script src="reliability.js"></script>
    <script src="notifications.js"></script>
    <script src="dom.js"></script>
    <script src="parts.js"></script>
    <script src="chart.js"></script>
    <script src="view.add.js"></script>
    <script src="view.home.js"></script>
    <script src="view.value.js"></script>
    <script src="view.builder.js"></script>
    <script src="view.settings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
