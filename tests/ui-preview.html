<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTTP Widgets UI preview</title>
  </head>
  <body>
    <!--
      The app in a browser, with tests/mock-tauri.js standing in for Rust.
      Serve the repository root (python3 -m http.server 4173) and open
      /tests/ui-preview.html, optionally with ?platform=ios and a route such
      as #/new or #/v/r1. See mock-tauri.js for the other switches.
    -->
    <script type="module">
      const response = await fetch('/ui/index.html', { cache: 'no-store' });
      const html = (await response.text())
        .replace('href="output.css"', 'href="/ui/output.css"')
        .replace(
          '<script src="api.js">',
          '<script src="/tests/mock-tauri.js"><\/script><script src="api.js">'
        )
        .replaceAll(/src="([\w.-]+\.js)"/g, 'src="/ui/$1"');
      document.open();
      document.write(html);
      document.close();
    </script>
  </body>
</html>
